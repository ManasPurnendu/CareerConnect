server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: careerconnect-backend

  config:
    import:
      - optional:file:./application-local.yml
      - optional:file:../application-local.yml

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/careerconnect_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: CareerConnectHikariPool

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:careerconnect-secure-jwt-secret-key-32-bytes-minimum-length-academic-project}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    root: INFO
    com.careerconnect: DEBUG
    org.springframework.web: INFO
    org.flywaydb: INFO
