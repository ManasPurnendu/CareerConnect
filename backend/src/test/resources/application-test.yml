server:
  port: -1

spring:
  application:
    name: careerconnect-backend-test

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:h2:mem:careerconnect_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: careerconnect-secure-jwt-secret-key-32-bytes-minimum-length-academic-project
    expiration-minutes: 30
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  resume:
    upload-dir: ./target/test-uploads/resumes

logging:
  level:
    root: WARN
    com.careerconnect: INFO
